{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · Reserva de Salas</title>
    <link rel="stylesheet" href="{% static 'reservas/estilo.css' %}">
</head>
<body>
    <main class="pagina-login">
        <section class="cartao-login">
            <h1>Reserva de Salas</h1>
            <p class="ajuda">Entre com a conta da sua organização.</p>
            {% if form.errors %}
                <div class="aviso aviso-error">Usuário ou senha inválidos. Tente novamente.</div>
            {% endif %}
            <form method="post" class="formulario formulario-login">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <p>
                    <label for="id_username">Usuário</label>
                    <input id="id_username" name="username" type="text" autocomplete="username" required autofocus>
                </p>
                <p>
                    <label for="id_password">Senha</label>
                    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
                </p>
                <button type="submit" class="botao">Entrar</button>
            </form>
        </section>
    </main>
</body>
</html>
