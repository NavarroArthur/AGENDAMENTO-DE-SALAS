{% extends 'reservas/base.html' %}

{% block titulo %}Confirmar exclusão{% endblock %}

{% block conteudo %}
<h1>Confirmar exclusão</h1>

<p>Tem certeza que deseja excluir {{ tipo }} <strong>{{ objeto }}</strong>?</p>
{% if extra %}<p class="ajuda">{{ extra }}</p>{% endif %}

<form method="post" class="formulario">
    {% csrf_token %}
    <div class="acoes-form">
        <button type="submit" class="botao perigo-botao">Sim, excluir</button>
        <a class="botao botao-secundario" href="{% url voltar %}">Cancelar</a>
    </div>
</form>
{% endblock %}
