{% extends 'reservas/base.html' %}

{% block titulo %}Nova reserva{% endblock %}

{% block conteudo %}
<h1>Nova reserva</h1>
<p class="ajuda">Reserva única. O sistema não deixa salvar se houver choque de horário na mesma sala.</p>

<form method="post" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="acoes-form">
        <button type="submit" class="botao">Salvar reserva</button>
        <a class="botao botao-secundario" href="{% url 'reservas:reserva_lista' %}">Cancelar</a>
    </div>
</form>
{% endblock %}
