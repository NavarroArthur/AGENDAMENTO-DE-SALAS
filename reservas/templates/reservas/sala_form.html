{% extends 'reservas/base.html' %}

{% block titulo %}{% if editando %}Editar sala{% else %}Nova sala{% endif %}{% endblock %}

{% block conteudo %}
<h1>{% if editando %}Editar sala{% else %}Nova sala{% endif %}</h1>

<form method="post" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="acoes-form">
        <button type="submit" class="botao">Salvar</button>
        <a class="botao botao-secundario" href="{% url 'reservas:sala_lista' %}">Cancelar</a>
    </div>
</form>
{% endblock %}
